name: Benchmarks
on:
  push:
    branches: [ "main" ]
    paths:
      - bsan-rt/**
      - bsan-pass/**
      - cargo-bsan/**
      - bsan-script/**
      - tests/benches/**
      - config.toml
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  actions: write
  contents: write
  packages: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
env:
  # Every target is benchmarked on its own runner.
  TARGETS: >-
    [{"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-24.04-arm"},
     {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-24.04"}]
jobs:
  # On `main`, benchmark everything, with Miri, for the ratio-over-time dashboard.
  #
  # On any other branch, the report compares the branch against `main`. `main`'s
  # own runs publish their raw results to gh-pages (main/raw.csv), so a branch
  # only benchmarks `main` itself for the targets and crates those results do not
  # cover, e.g. before `main` has published any, or for a crate the branch added
  # or bumped.
  setup:
    name: Plan runs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      main_sha: ${{ steps.plan.outputs.main_sha }}
      bench_main: ${{ steps.plan.outputs.bench_main }}
      cached_main_commit: ${{ steps.plan.outputs.cached_main_commit }}
    steps:
    - uses: actions/checkout@v7
    - name: Fetch main's published results
      if: github.ref != 'refs/heads/main'
      run: |
        mkdir -p main-cache
        if git fetch --depth=1 origin gh-pages \
           && git show FETCH_HEAD:main/raw.csv > main-cache/raw.csv 2>/dev/null; then
          git show FETCH_HEAD:main/meta.json > main-cache/meta.json 2>/dev/null \
            || echo '{}' > main-cache/meta.json
          echo "Found main's results for commit $(jq -r '.commit // "unknown"' main-cache/meta.json)."
        else
          rm -f main-cache/raw.csv
          echo "No published results for main; it will be benchmarked in this run."
        fi
    - name: Plan the benchmark matrix
      id: plan
      run: |
        set -euo pipefail
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          main_sha="$GITHUB_SHA"
        else
          # Pin `main` now, so every job that measures it measures the same commit.
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
        fi
        printf '%s' "$TARGETS" > "$RUNNER_TEMP/targets.json"
        cache_args=()
        if [ -f main-cache/raw.csv ]; then
          cache_args=(--main-cache main-cache/raw.csv)
        fi
        matrix=$(python3 bsan-script/etc/bench_plan.py \
          tests/benches/crates.json "$RUNNER_TEMP/targets.json" \
          --ref-name "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --main-sha "$main_sha" \
          "${cache_args[@]}")
        n_main=$(jq '[.include[] | select(.label == "main")] | length' <<< "$matrix")
        n_branch=$(jq '[.include[] | select(.label == "branch")] | length' <<< "$matrix")
        # The cache is used for whatever this run does not benchmark itself.
        cached=""
        if [ -f main-cache/raw.csv ] && [ "$n_main" -lt "$n_branch" ]; then
          cached=$(jq -r '.commit // "unknown"' main-cache/meta.json)
        fi
        {
          echo "matrix=$matrix"
          echo "main_sha=$main_sha"
          echo "bench_main=$([ "$n_main" -gt 0 ] && echo true || echo false)"
          echo "cached_main_commit=$cached"
        } >> "$GITHUB_OUTPUT"
    - name: Upload main's published results
      if: steps.plan.outputs.cached_main_commit != ''
      uses: actions/upload-artifact@v7
      with:
        # Hand the merge job the exact copy this plan was made from, rather than
        # letting it re-read gh-pages after a `main` run may have replaced it.
        name: main-cache
        path: main-cache/
        retention-days: 1
  bench:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/borrowsanitizer/bsan:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    # Steps in a container job default to `sh`, not bash.
    defaults:
      run:
        shell: bash
    name: "${{ matrix.label }}: ${{ matrix.crate }} (${{ matrix.target }})"
    steps:
    # The BorrowSanitizer under test: the branch, or `main` for the baseline.
    - uses: actions/checkout@v7
      with:
        ref: ${{ matrix.ref }}
    # The harness always comes from the commit being run, so both sides of a
    # comparison are measured by the same bench.py over the same crates.json.
    - name: Check out benchmark harness
      uses: actions/checkout@v7
      with:
        path: .bench-harness
        sparse-checkout: |
          bsan-script/etc
          tests/benches
    - name: Setup dependencies
      run: |
        ln -s /root/.rustup/ $HOME/.rustup
        sudo apt-get update && sudo apt-get install -y hyperfine jq
    - name: Build and Install Latest Version
      run: ./xb install
    - name: Set output filename
      id: filename
      env:
        LABEL: ${{ matrix.label }}
        TARGET: ${{ matrix.target }}
        CRATE: ${{ matrix.crate }}
      run: echo "results=results_${LABEL}_${TARGET}_${CRATE}" >> "$GITHUB_OUTPUT"
    - name: Benchmarks
      env:
        TARGET: ${{ matrix.target }}
        CRATE: ${{ matrix.crate }}
        MIRI: ${{ matrix.miri }}
        RESULTS: ${{ steps.filename.outputs.results }}
      run: |
        flags=(--crate "$CRATE")
        if [ "$MIRI" != true ]; then
          flags+=(--no-miri)
        fi
        python3 ./.bench-harness/bsan-script/etc/bench.py \
        "${flags[@]}" \
        ./.bench-harness/tests/benches/crates.json \
        "$TARGET" \
        "$RESULTS.json" \
        "$RESULTS.csv"
    - name: Upload results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.filename.outputs.results }}
        path: |
          ${{ steps.filename.outputs.results }}.json
          ${{ steps.filename.outputs.results }}.csv
        retention-days: 30
  merge:
    name: Merge & Upload
    needs: [setup, bench]
    runs-on: ubuntu-latest
    # Every publishing path below commits to `gh-pages`. The workflow-level group
    # is keyed on `github.ref`, which would let two branches race each other's
    # push, so serialize here.
    concurrency:
      group: benchmarks-gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
    - name: Download main results
      if: needs.setup.outputs.bench_main == 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: results_main_*
        merge-multiple: true
        path: results/main/
    - name: Download branch results
      if: github.ref != 'refs/heads/main'
      uses: actions/download-artifact@v8
      with:
        pattern: results_branch_*
        merge-multiple: true
        path: results/branch/
    - name: Download main's published results
      if: needs.setup.outputs.cached_main_commit != ''
      uses: actions/download-artifact@v8
      with:
        name: main-cache
        path: main-cache/
    - name: Set merged filename
      if: github.ref == 'refs/heads/main'
      id: merged_filename
      run: echo "name=results_$(date +%Y-%m-%d_%H-%M-%S)" >> "$GITHUB_OUTPUT"
    - name: Merge JSON files
      if: github.ref == 'refs/heads/main'
      run: jq -s 'add' results/main/*.json > ${{ steps.merged_filename.outputs.name }}.json
    - name: Upload merged results
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.merged_filename.outputs.name }}
        path: ${{ steps.merged_filename.outputs.name }}.json
        retention-days: 30
    # `main` keeps the site root and its ratio-over-time dashboard, plus its raw
    # results under main/ for branches to compare against. A branch gets its own
    # directory and its own page, comparing it against `main`.
    - name: Resolve Pages location
      id: pages
      run: |
        owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
        root="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          echo "url=${root}" >> "$GITHUB_OUTPUT"
        else
          # Branch names may contain `/` and other characters that are awkward
          # in a path, so flatten them into a single segment.
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9._-]|-|g')
          echo "dir=branches/${slug}" >> "$GITHUB_OUTPUT"
          echo "url=${root}branches/${slug}/" >> "$GITHUB_OUTPUT"
        fi
        echo "root=${root}" >> "$GITHUB_OUTPUT"
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      if: github.ref == 'refs/heads/main'
      with:
        name: Benchmarks
        tool: 'customSmallerIsBetter'
        output-file-path: ${{ steps.merged_filename.outputs.name }}.json
        # Access token to deploy GitHub Pages branch
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Push and deploy GitHub pages branch automatically
        auto-push: true
        benchmark-data-dir-path: .
        fail-on-alert: true
        comment-on-alert: true
        alert-threshold: 150%
        alert-comment-cc-users: '@icmccorm,@mojeanmac'
    - name: Publish main's raw results
      if: github.ref == 'refs/heads/main'
      env:
        PAGES: ${{ runner.temp }}/pages
      run: |
        set -euo pipefail
        # The previous step has just pushed to gh-pages, so fetch it again.
        git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
        git worktree add -B gh-pages "$PAGES" origin/gh-pages
        mkdir -p "$PAGES/main"
        # Every per-crate CSV has the same header; keep only the first one.
        awk 'FNR == 1 && NR != 1 { next } { print }' results/main/*.csv > "$PAGES/main/raw.csv"
        jq -n --arg commit "$GITHUB_SHA" --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{commit: $commit, generated: $generated}' > "$PAGES/main/meta.json"
        cd "$PAGES"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Publish raw benchmark results for main at ${GITHUB_SHA}"
          git push origin gh-pages
        fi
    - name: Build branch report
      if: github.ref != 'refs/heads/main'
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        MAIN_SHA: ${{ needs.setup.outputs.main_sha }}
        BENCH_MAIN: ${{ needs.setup.outputs.bench_main }}
        CACHED_MAIN_COMMIT: ${{ needs.setup.outputs.cached_main_commit }}
      run: |
        set -euo pipefail
        # The published copy goes first, so a crate this run re-measured on main
        # replaces it (the last row for a test wins).
        main_csvs=()
        commits=()
        if [ -n "$CACHED_MAIN_COMMIT" ]; then
          main_csvs+=(main-cache/raw.csv)
          commits+=(--main-commit "$CACHED_MAIN_COMMIT")
        fi
        if [ "$BENCH_MAIN" = true ]; then
          main_csvs+=(results/main/*.csv)
          commits+=(--main-commit "$MAIN_SHA")
        fi
        python3 bsan-script/etc/branch_report.py data.json \
          --branch-csv results/branch/*.csv \
          --main-csv "${main_csvs[@]}" \
          "${commits[@]}" \
          --branch "$GITHUB_REF_NAME" \
          --commit "$GITHUB_SHA" \
          --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --run-url "$RUN_URL"
    - name: Publish branch page
      if: github.ref != 'refs/heads/main'
      env:
        DIR: ${{ steps.pages.outputs.dir }}
        ROOT: ${{ steps.pages.outputs.root }}
        PAGES: ${{ runner.temp }}/pages
      run: |
        set -euo pipefail
        git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
        git worktree add -B gh-pages "$PAGES" origin/gh-pages
        cd "$PAGES"
        if [ ! -f branch-page/index.html ]; then
          echo "::error::gh-pages has no branch-page/index.html. The per-branch page lives on gh-pages beside the root dashboard; add branch-page/{index.html,main.js,branch.css} there."
          exit 1
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        # Only the page shell is copied per branch, because a directory needs its
        # own index.html to be served. main.js and branch.css are loaded out of
        # branch-page/, so fixing the page reaches every branch immediately
        # instead of waiting for each one to be benchmarked again.
        mkdir -p "$DIR"
        cp branch-page/index.html "$DIR/index.html"
        cp "$GITHUB_WORKSPACE/data.json" "$DIR/data.json"

        {
          echo '<!DOCTYPE html>'
          echo '<html lang="en"><head><meta charset="utf-8">'
          echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
          echo '<link rel="stylesheet" href="../style.css">'
          echo '<link rel="icon" type="image/x-icon" href="../favicon.svg">'
          echo '<title>BorrowSanitizer Benchmarks: branches</title></head>'
          echo '<body><header id="header"><h1 class="dashboard-title">Benchmarks by branch</h1></header>'
          echo "<main id=\"main\"><ul><li><a href=\"${ROOT}\">main (history)</a></li>"
          for d in branches/*/; do
            [ -f "${d}data.json" ] || continue
            n=$(basename "$d")
            echo "<li><a href=\"${n}/\">${n}</a></li>"
          done
          echo '</ul></main></body></html>'
        } > branches/index.html

        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Publish benchmark report for ${GITHUB_REF_NAME}"
          git push origin gh-pages
        fi
    - name: Link to results
      run: |
        echo "Benchmarks published to <${{ steps.pages.outputs.url }}>" >> "$GITHUB_STEP_SUMMARY"
