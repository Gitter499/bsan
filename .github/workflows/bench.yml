name: Benchmarks
on:
  push:
    branches: [ "main" ]
    paths:
      - bsan-rt/**
      - bsan-pass/**
      - cargo-bsan/**
      - bsan-script/**
      - tests/benches/**
      - config.toml
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  actions: write
  contents: write
  packages: read
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    name: Compute crate matrix
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.crates.outputs.crates }}
    steps:
    - uses: actions/checkout@v7
    - name: Read crate list from crates.json
      id: crates
      run: echo "crates=$(jq -c '[.[].name]' tests/benches/crates.json)" >> "$GITHUB_OUTPUT"
  bench:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
        crate: ${{ fromJson(needs.setup.outputs.crates) }}
    runs-on: ${{ matrix.config.os }}
    container:
      image: ghcr.io/borrowsanitizer/bsan:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    name: ${{ matrix.crate }} (${{ matrix.config.target }})
    steps:
    - uses: actions/checkout@v7
    - name: Setup dependencies
      run: |
        ln -s /root/.rustup/ $HOME/.rustup
        sudo apt-get update && sudo apt-get install -y hyperfine jq
    - name: Build and Install Latest Version
      run: ./xb install
    - name: Set output filename
      id: filename
      env:
        TARGET: ${{ matrix.config.target }}
        CRATE: ${{ matrix.crate }}
      run: echo "results=results_$(date +%Y-%m-%d_%H-%M-%S)_${TARGET}_${CRATE}" >> "$GITHUB_OUTPUT"
    - name: Benchmarks
      env:
        TARGET: ${{ matrix.config.target }}
        CRATE: ${{ matrix.crate }}
        RESULTS: ${{ steps.filename.outputs.results }}
      run: |
        python3 ./bsan-script/etc/bench.py \
        --crate "$CRATE" \
        ./tests/benches/crates.json \
        "$TARGET" \
        "$RESULTS.json" \
        "$RESULTS.csv"
    - name: Upload results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.filename.outputs.results }}
        path: |
          ${{ steps.filename.outputs.results }}.json
          ${{ steps.filename.outputs.results }}.csv
        retention-days: 30
  merge:
    name: Merge & Upload
    needs: bench
    runs-on: ubuntu-latest
    # Both publishing paths below commit to `gh-pages`. The workflow-level group
    # is keyed on `github.ref`, which would let two branches race each other's
    # push, so serialize here.
    concurrency:
      group: benchmarks-gh-pages
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v7
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: results_*
        merge-multiple: true
        path: results/
    - name: Set merged filename
      id: merged_filename
      run: echo "name=results_$(date +%Y-%m-%d_%H-%M-%S)" >> "$GITHUB_OUTPUT"
    - name: Merge JSON files
      run: jq -s 'add' results/*.json > ${{ steps.merged_filename.outputs.name }}.json
    - name: Upload merged results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.merged_filename.outputs.name }}
        path: ${{ steps.merged_filename.outputs.name }}.json
        retention-days: 30
    # `main` keeps the site root and its ratio-over-time dashboard. A branch has
    # no history to plot against, so it gets its own directory and its own page:
    # per-crate wall time for this one run, over the workload every configuration
    # completed, plus the tests they disagreed on.
    - name: Resolve Pages location
      id: pages
      run: |
        owner=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
        root="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
        if [ "$GITHUB_REF" = "refs/heads/main" ]; then
          echo "url=${root}" >> "$GITHUB_OUTPUT"
        else
          # Branch names may contain `/` and other characters that are awkward
          # in a path, so flatten them into a single segment.
          slug=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|[^a-z0-9._-]|-|g')
          echo "dir=branches/${slug}" >> "$GITHUB_OUTPUT"
          echo "url=${root}branches/${slug}/" >> "$GITHUB_OUTPUT"
        fi
        echo "root=${root}" >> "$GITHUB_OUTPUT"
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      if: github.ref == 'refs/heads/main'
      with:
        name: Benchmarks
        tool: 'customSmallerIsBetter'
        output-file-path: ${{ steps.merged_filename.outputs.name }}.json
        # Access token to deploy GitHub Pages branch
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # Push and deploy GitHub pages branch automatically
        auto-push: true
        benchmark-data-dir-path: .
        fail-on-alert: true
        comment-on-alert: true
        alert-threshold: 150%
        alert-comment-cc-users: '@icmccorm,@mojeanmac'
    - name: Build branch report
      if: github.ref != 'refs/heads/main'
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 bsan-script/etc/branch_report.py data.json results/*.csv \
          --branch "$GITHUB_REF_NAME" \
          --commit "$GITHUB_SHA" \
          --repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --run-url "$RUN_URL"
    - name: Publish branch page
      if: github.ref != 'refs/heads/main'
      env:
        DIR: ${{ steps.pages.outputs.dir }}
        ROOT: ${{ steps.pages.outputs.root }}
        PAGES: ${{ runner.temp }}/pages
      run: |
        set -euo pipefail
        git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
        git worktree add -B gh-pages "$PAGES" origin/gh-pages
        cd "$PAGES"
        if [ ! -f branch-page/index.html ]; then
          echo "::error::gh-pages has no branch-page/index.html. The per-branch page lives on gh-pages beside the root dashboard; add branch-page/{index.html,main.js,branch.css} there."
          exit 1
        fi
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

        # Only the page shell is copied per branch, because a directory needs its
        # own index.html to be served. main.js and branch.css are loaded out of
        # branch-page/, so fixing the page reaches every branch immediately
        # instead of waiting for each one to be benchmarked again.
        mkdir -p "$DIR"
        cp branch-page/index.html "$DIR/index.html"
        cp "$GITHUB_WORKSPACE/data.json" "$DIR/data.json"

        {
          echo '<!DOCTYPE html>'
          echo '<html lang="en"><head><meta charset="utf-8">'
          echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
          echo '<link rel="stylesheet" href="../style.css">'
          echo '<link rel="icon" type="image/x-icon" href="../favicon.svg">'
          echo '<title>BorrowSanitizer Benchmarks: branches</title></head>'
          echo '<body><header id="header"><h1 class="dashboard-title">Benchmarks by branch</h1></header>'
          echo "<main id=\"main\"><ul><li><a href=\"${ROOT}\">main (history)</a></li>"
          for d in branches/*/; do
            [ -f "${d}data.json" ] || continue
            n=$(basename "$d")
            echo "<li><a href=\"${n}/\">${n}</a></li>"
          done
          echo '</ul></main></body></html>'
        } > branches/index.html

        git add -A
        if ! git diff --staged --quiet; then
          git commit -m "Publish benchmark report for ${GITHUB_REF_NAME}"
          git push origin gh-pages
        fi
    - name: Link to results
      run: |
        echo "Benchmarks published to <${{ steps.pages.outputs.url }}>" >> "$GITHUB_STEP_SUMMARY"
